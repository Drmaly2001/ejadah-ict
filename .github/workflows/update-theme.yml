name: Update to Black & Gold Theme

on:
  workflow_dispatch:   # allows manual trigger from GitHub
  push:
    branches:
      - main

jobs:
  update-theme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Overwrite index.html
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Ejadah ICT — Enterprise Solutions</title>
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <link rel="stylesheet" href="css/styles.css">
          </head>
          <body>

              <header>
                  <div class="logo">Ejadah<span>ICT</span></div>
                  <nav>
                      <a href="#">Home</a>
                      <a href="#">Services</a>
                      <a href="#">Projects</a>
                      <a href="#">About</a>
                      <a href="#">Contact</a>
                  </nav>
              </header>

              <section class="hero">
                  <h2>Innovative ICT & Cybersecurity</h2>
                  <p>Delivering professional tech solutions for your business.</p>
                  <button>Contact Us</button>
              </section>

              <footer>
                  <p>© 2026 Ejadah ICT. All rights reserved.</p>
              </footer>

          </body>
          </html>
          EOF

      - name: Ensure css folder exists
        run: mkdir -p css

      - name: Overwrite styles.css
        run: |
          cat > css/styles.css << 'EOF'
          :root {
              --black: #000000;
              --off-black: #111;
              --gold: #D4AF37;
              --light-gold: #FFD700;
              --white: #fff;
              --gray: #ccc;
          }

          * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
          }

          body {
              font-family: Arial, sans-serif;
              background: var(--black);
              color: var(--white);
          }

          header {
              display: flex;
              justify-content: space-between;
              align-items: center;
              background: var(--black);
              border-bottom: 2px solid var(--gold);
              padding: 15px 10%;
          }

          .logo {
              font-size: 28px;
              font-weight: bold;
              color: var(--gold);
          }

          .logo span {
              color: var(--white);
          }

          nav a {
              text-decoration: none;
              margin-left: 18px;
              color: var(--gold);
              font-weight: bold;
              transition: .3s;
          }

          nav a:hover {
              color: var(--light-gold);
          }

          .hero {
              text-align: center;
              padding: 80px 20px;
              background: var(--off-black);
          }

          .hero h2 {
              font-size: 36px;
              color: var(--gold);
              margin-bottom: 12px;
          }

          .hero p {
              color: var(--gray);
              margin-bottom: 20px;
          }

          button {
              padding: 10px 26px;
              background: var(--gold);
              border: none;
              color: var(--black);
              font-weight: bold;
              cursor: pointer;
              border-radius: 4px;
          }

          button:hover {
              background: var(--light-gold);
          }

          footer {
              text-align: center;
              padding: 14px;
              border-top: 2px solid var(--gold);
              background: var(--off-black);
              color: var(--gold);
          }
          EOF

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Automated update: Black & Gold Theme" || echo "No changes to commit"
          git push
