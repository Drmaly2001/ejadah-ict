name: Update to Black & Gold Theme (Safe)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-theme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Only Root Colors
        run: |
          if [ -f "css/styles.css" ]; then
            sed -i '/:root {/,/}/c\
:root {\
  --gold: #D4AF37;\
  --gold-light: #F5D76E;\
  --gold-dark: #B8962E;\
  --gold-glow: rgba(212, 175, 55, 0.18);\
  --black: #0B0B0C;\
  --black-soft: #121214;\
  --black-light: #1A1A1D;\
  --black-card: #161618;\
  --green: var(--gold);\
  --green-light: var(--gold-light);\
  --green-dark: var(--gold-dark);\
  --green-glow: var(--gold-glow);\
  --blue: var(--gold);\
  --blue-light: var(--gold-light);\
  --blue-dark: var(--gold-dark);\
  --blue-deep: var(--black);\
  --blue-glow: var(--gold-glow);\
  --white: #FFFFFF;\
  --bg: var(--black);\
  --bg-light: var(--black-soft);\
  --bg-section: var(--black-light);\
  --bg-dark: #000000;\
  --bg-darker: #000000;\
  --text: #F5F5F5;\
  --text-secondary: #C9C9C9;\
  --text-muted: #8A8A8A;\
  --text-white: #FFFFFF;\
  --text-on-dark: #CFCFCF;\
  --border: rgba(212, 175, 55, 0.2);\
  --border-green: rgba(212, 175, 55, 0.35);\
  --border-blue: rgba(212, 175, 55, 0.35);\
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);\
  --shadow-md: 0 6px 20px rgba(0,0,0,0.5);\
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);\
  --shadow-xl: 0 24px 60px rgba(0,0,0,0.7);\
  --shadow-green: 0 8px 30px rgba(212,175,55,0.35);\
  --shadow-blue: 0 8px 30px rgba(212,175,55,0.35);\
  --radius-sm: 8px;\
  --radius: 12px;\
  --radius-lg: 20px;\
  --radius-xl: 28px;\
  --container: 1280px;\
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);\
}' css/styles.css
          else
            echo "css/styles.css not found!"
            exit 1
          fi

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add css/styles.css
          git commit -m "Theme updated to Black & Gold (safe root update)" || echo "No changes to commit"
          git push
